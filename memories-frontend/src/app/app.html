<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-text">Memories</span>
    </a>

    <nav class="site-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/timeline" routerLinkActive="active">Timeline</a>
      <a routerLink="/gallery" routerLinkActive="active">Gallery</a>
      <a routerLink="/add" class="btn btn-primary nav-cta">+ Add memory</a>
    </nav>
  </div>
</header>

<main class="site-main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <p class="muted">Made to hold the moments that connect us.</p>
  </div>
</footer>
